name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GLIBC_VERSION: "2.28"

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: server-sponge-linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: server-sponge-linux-arm64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: server-sponge-linux-amd64-musl
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifact: server-sponge-linux-arm64-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Install Zig
        run: |
          curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz | tar xJ -C /tmp
          echo "/tmp/zig-x86_64-linux-0.16.0" >> $GITHUB_PATH

      - name: Build (glibc ${{ env.GLIBC_VERSION }} compatible)
        if: ${{ !endsWith(matrix.target, '-musl') }}
        run: |
          cargo zigbuild --release --target ${{ matrix.target }}.${{ env.GLIBC_VERSION }}

      - name: Build (musl static)
        if: ${{ endsWith(matrix.target, '-musl') }}
        run: |
          cargo zigbuild --release --target ${{ matrix.target }}

      - name: Package
        run: |
          set -x
          mkdir -p dist
          case "${{ matrix.target }}" in
            *-musl)
              SRC="target/${{ matrix.target }}/release/server-sponge"
              ;;
            *)
              SRC="target/${{ matrix.target }}.${{ env.GLIBC_VERSION }}/release/server-sponge"
              ;;
          esac
          echo "Looking for binary at: $SRC"
          ls -la "$(dirname "$SRC")" 2>/dev/null || echo "Directory not found: $(dirname "$SRC")"
          cp -v "$SRC" "dist/${{ matrix.artifact }}"
          chmod +x "dist/${{ matrix.artifact }}"

      - name: Verify glibc compatibility
        if: ${{ !endsWith(matrix.target, '-musl') }}
        run: |
          echo "=== GLIBC symbol versions in binary ==="
          strings dist/${{ matrix.artifact }} | grep -E '^GLIBC_[0-9]+\.[0-9]+$' | sort -V | uniq
          MAX=$(strings dist/${{ matrix.artifact }} | grep -E '^GLIBC_[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "Max required: $MAX"
          if [ -n "$MAX" ] && echo "$MAX" | grep -q "GLIBC"; then
            VER=$(echo "$MAX" | sed 's/GLIBC_//')
            HIGHER=$(echo -e "$VER\n${{ env.GLIBC_VERSION }}" | sort -V | tail -1)
            if [ "$HIGHER" != "${{ env.GLIBC_VERSION }}" ]; then
              echo "❌ ERROR: Binary requires glibc $VER > target ${{ env.GLIBC_VERSION }}"
              exit 1
            fi
            echo "✅ Binary requires glibc <= ${{ env.GLIBC_VERSION }}"
          fi

      - name: Verify fully static (musl)
        if: ${{ endsWith(matrix.target, '-musl') }}
        run: |
          BIN="dist/${{ matrix.artifact }}"
          echo "=== File type ==="
          file "$BIN"
          echo "=== Dynamic dependencies ==="
          ldd "$BIN" 2>&1 || true
          echo "=== GLIBC symbols ==="
          SYMS=$(strings "$BIN" | grep -E '^GLIBC_' | sort -V)
          if [ -n "$SYMS" ]; then
            echo "❌ Found GLIBC symbols:"
            echo "$SYMS"
            exit 1
          else
            echo "✅ No GLIBC symbols — fully static"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
