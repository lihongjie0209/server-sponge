name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  GLIBC_VERSION: "2.28"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --all
      - name: Build (release)
        run: cargo build --release

  glibc-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Install Zig
        run: |
          curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz | tar xJ -C /tmp
          echo "/tmp/zig-x86_64-linux-0.16.0" >> $GITHUB_PATH
      - name: Build with glibc ${{ env.GLIBC_VERSION }} target
        run: |
          cargo zigbuild --release --target x86_64-unknown-linux-gnu.${{ env.GLIBC_VERSION }}
      - name: Verify glibc compatibility
        run: |
          BIN="target/x86_64-unknown-linux-gnu.${{ env.GLIBC_VERSION }}/release/server-sponge"
          echo "=== GLIBC symbol versions in binary ==="
          strings "$BIN" | grep -E '^GLIBC_[0-9]+\.[0-9]+$' | sort -V | uniq
          MAX=$(strings "$BIN" | grep -E '^GLIBC_[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "Max required: $MAX"
          if [ -n "$MAX" ] && echo "$MAX" | grep -q "GLIBC"; then
            VER=$(echo "$MAX" | sed 's/GLIBC_//')
            HIGHER=$(echo -e "$VER\n${{ env.GLIBC_VERSION }}" | sort -V | tail -1)
            if [ "$HIGHER" != "${{ env.GLIBC_VERSION }}" ]; then
              echo "❌ ERROR: Binary requires glibc $VER > target ${{ env.GLIBC_VERSION }}"
              exit 1
            fi
            echo "✅ Binary requires glibc <= ${{ env.GLIBC_VERSION }}"
          fi

  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Build (musl static)
        run: |
          cargo build --release --target x86_64-unknown-linux-musl
      - name: Verify fully static binary
        run: |
          BIN="target/x86_64-unknown-linux-musl/release/server-sponge"
          echo "=== File type ==="
          file "$BIN"
          echo "=== Dynamic dependencies ==="
          ldd "$BIN" 2>&1 || true
          echo "=== GLIBC symbols ==="
          SYMS=$(strings "$BIN" | grep -E '^GLIBC_' | sort -V)
          if [ -n "$SYMS" ]; then
            echo "❌ Found GLIBC symbols:"
            echo "$SYMS"
            exit 1
          else
            echo "✅ No GLIBC symbols — fully static"
          fi
