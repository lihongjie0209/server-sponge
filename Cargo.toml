[package]
name = "server-sponge"
version = "0.6.2"
edition = "2021"
description = "Dynamic Server Sponge with PID control and PSI monitoring"

[dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["event", "fs"] }
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
flexi_logger = { version = "0.28", features = ["compress"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
axum = "0.7"
tokio = { version = "1", features = ["rt", "net", "time"] }
tokio-stream = "0.1"

[profile.release]
opt-level = 3
lto = true
